<style>
  :root{
    --bg-0:#03080a; --bg-2:#02120a;
    --neon:#00ff41; --neon-2:#39ff14; --neon-soft:#7cff9b;
    --neon-dim:rgba(0,255,65,.18); --neon-line:rgba(0,255,65,.07);
    --cyan:#00e5ff; --magenta:#ff2bd6; --red:#ff0033;
    --txt:#c9ffd6; --muted:#5fae74; --dark:#020a05;
    --panel-2:rgba(2,12,6,.92);
    --f-hud:'Orbitron',sans-serif;
    --f-mono:'Share Tech Mono',ui-monospace,Consolas,monospace;
    --f-body:'Rajdhani',system-ui,Segoe UI,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{min-height:100%;overflow-y:auto}
  body{height:auto}
  body{
    margin:0; font-family:var(--f-body); color:var(--txt); background:var(--bg-0);
    min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow-x:hidden; position:relative; padding:60px 16px 76px;
    text-shadow:0 0 1px rgba(0,255,65,.25);
  }
  .bg-glow{position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(900px 540px at 50% 32%, rgba(0,255,65,.12), transparent 62%),
      radial-gradient(700px 500px at 50% 110%, rgba(0,229,255,.06), transparent 60%),
      linear-gradient(180deg, var(--bg-2), var(--bg-0) 70%);}
  .bg-grid{position:fixed; inset:0; z-index:1; pointer-events:none;
    background-image:
      repeating-linear-gradient(0deg, var(--neon-line) 0 1px, transparent 1px 46px),
      repeating-linear-gradient(90deg, var(--neon-line) 0 1px, transparent 1px 46px);
    -webkit-mask-image:radial-gradient(circle at 50% 42%, #000 25%, transparent 82%);
    mask-image:radial-gradient(circle at 50% 42%, #000 25%, transparent 82%);}
  .bg-floor{position:fixed; left:50%; bottom:-2px; width:320vw; height:62vh; z-index:1; pointer-events:none;
    transform:translateX(-50%) perspective(220px) rotateX(76deg); transform-origin:bottom center;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,255,65,.22) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(90deg, rgba(0,255,65,.16) 0 1px, transparent 1px 64px);
    -webkit-mask-image:linear-gradient(to top, #000 0%, rgba(0,0,0,.5) 35%, transparent 78%);
    mask-image:linear-gradient(to top, #000 0%, rgba(0,0,0,.5) 35%, transparent 78%); opacity:.85;}
  .scanlines{position:fixed; inset:0; z-index:40; pointer-events:none; mix-blend-mode:overlay; opacity:.5;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.5) 0 1px, transparent 1px 3px);
    animation:flick 6s steps(60) infinite;}
  @keyframes flick{0%,97%{opacity:.5}98%{opacity:.32}99%{opacity:.6}100%{opacity:.5}}
  .hud-frame{position:fixed; inset:14px; z-index:25; pointer-events:none;}
  .hud-frame .cn{position:absolute; width:34px; height:34px; border:2px solid var(--neon);
    filter:drop-shadow(0 0 6px rgba(0,255,65,.7)); opacity:.8;}
  .hud-frame .tl{top:0;left:0;border-right:0;border-bottom:0}
  .hud-frame .tr{top:0;right:0;border-left:0;border-bottom:0}
  .hud-frame .bl{bottom:0;left:0;border-right:0;border-top:0}
  .hud-frame .br{bottom:0;right:0;border-left:0;border-top:0}

  .card{flex-shrink:0;position:relative; z-index:20; width:min(470px,100%);
    background:linear-gradient(180deg, rgba(0,40,18,.35), var(--panel-2));
    border:1px solid var(--neon-dim); padding:30px 26px 24px;
    box-shadow:0 0 0 1px rgba(0,255,65,.06) inset, 0 0 40px rgba(0,255,65,.12), 0 30px 80px rgba(0,0,0,.7);
    backdrop-filter:blur(7px); animation:cardIn .5s cubic-bezier(.2,.9,.2,1) both; overflow:hidden;}
  @keyframes cardIn{
    0%{opacity:0; transform:translateY(14px) scaleY(.96); filter:blur(6px) hue-rotate(90deg)}
    35%{opacity:1; transform:translateY(0) skewX(-1.5deg); filter:blur(0)}
    38%{transform:skewX(1.2deg)} 41%{transform:skewX(0)} 100%{transform:none; filter:none}}
  .card .cc{position:absolute; width:18px; height:18px; border:2px solid var(--neon); z-index:6; pointer-events:none;
    filter:drop-shadow(0 0 5px rgba(0,255,65,.6));}
  .card .cc.tl{top:8px;left:8px;border-right:0;border-bottom:0}
  .card .cc.tr{top:8px;right:8px;border-left:0;border-bottom:0}
  .card .cc.bl{bottom:8px;left:8px;border-right:0;border-top:0}
  .card .cc.br{bottom:8px;right:8px;border-left:0;border-top:0}

  .brand{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:20px;}
  .avatar{width:64px; height:64px; display:grid; place-items:center; font-family:var(--f-hud);
    font-weight:900; font-size:24px; color:#02140a;
    background:linear-gradient(135deg,var(--neon),var(--cyan));
    clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
    filter:drop-shadow(0 0 12px rgba(0,255,65,.7));}
  .kicker{font-family:var(--f-mono); font-size:11px; letter-spacing:3px; text-transform:uppercase;
    color:var(--neon); text-shadow:0 0 10px rgba(0,255,65,.6);}
  .kicker::before{content:"[ "; color:var(--muted)} .kicker::after{content:" ]"; color:var(--muted)}
  .glitch{position:relative; font-family:var(--f-hud); font-weight:900; font-size:21px; letter-spacing:1px;
    margin:2px 0 0; text-align:center; color:#eafff0; text-transform:uppercase; text-shadow:0 0 12px rgba(0,255,65,.45);}
  .glitch::before,.glitch::after{content:attr(data-text); position:absolute; left:0; top:0; width:100%; overflow:hidden; text-align:center;}
  .glitch::before{color:var(--cyan); clip-path:inset(0 0 55% 0); animation:gTop 3.2s infinite steps(2);}
  .glitch::after{color:var(--magenta); clip-path:inset(55% 0 0 0); animation:gBot 2.7s infinite steps(2);}
  @keyframes gTop{0%,92%,100%{transform:none;opacity:0}93%{transform:translate(-3px,-1px);opacity:.9}96%{transform:translate(2px,1px);opacity:.7}}
  @keyframes gBot{0%,90%,100%{transform:none;opacity:0}91%{transform:translate(3px,1px);opacity:.9}95%{transform:translate(-2px,-1px);opacity:.7}}
  p.sub{margin:4px 0 0; font-size:13.5px; color:var(--neon-soft); text-align:center; letter-spacing:.4px;}

  .panel{background:rgba(2,14,7,.6); border:1px solid var(--neon-dim); padding:16px; position:relative;}
  .panel + .panel{margin-top:14px;}
  .panel::after{content:""; position:absolute; top:-1px; left:14px; width:34px; height:2px; background:var(--neon); box-shadow:0 0 8px var(--neon);}

  .btn{all:unset;box-sizing:border-box; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:13px 14px; font-family:var(--f-hud); font-weight:700; font-size:13px; letter-spacing:1.5px;
    text-transform:uppercase; text-align:center; transition:.18s;
    clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));}
  .btn-primary{background:linear-gradient(135deg,var(--neon),var(--neon-2)); color:#02140a; filter:drop-shadow(0 0 7px rgba(0,255,65,.55));}
  .btn-primary:hover{filter:drop-shadow(0 0 16px rgba(0,255,65,.9)) brightness(1.08); transform:translateY(-1px);}
  .btn-green{background:linear-gradient(135deg,var(--neon-2),var(--cyan)); color:#02140a; filter:drop-shadow(0 0 7px rgba(0,229,255,.5));}
  .btn-green:hover{filter:drop-shadow(0 0 16px rgba(0,229,255,.85)) brightness(1.08); transform:translateY(-1px);}

  
  .cap-widget{display:flex; align-items:center; gap:14px; padding:16px; background:rgba(2,14,7,.6);
    border:1px solid var(--neon-dim);}
  .cap-box{width:30px; height:30px; border:2px solid var(--neon-soft); background:#020a05; flex:0 0 auto;
    display:grid; place-items:center; cursor:pointer; position:relative; transition:.2s;}
  .cap-box .tick{opacity:0; color:#02140a; font-weight:900; font-size:18px; line-height:1;}
  .cap-box.checked{border-color:var(--neon); background:var(--neon);}
  .cap-box.checked .tick{opacity:1;}
  .cap-box.spin{border-color:var(--cyan); cursor:progress;}
  .cap-box.spin .tick{opacity:0;}
  .cap-box.spin::after{content:""; position:absolute; width:16px; height:16px; border:2px solid transparent;
    border-top-color:var(--cyan); border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .cap-label{flex:1; font-size:15px; color:#eafff0; letter-spacing:.3px;}
  .cap-brand{display:flex; flex-direction:column; align-items:center; gap:3px; font-family:var(--f-mono);
    font-size:8px; letter-spacing:1px; color:var(--neon-soft); text-transform:uppercase;}
  .cap-brand .shield{width:28px; height:28px; display:grid; place-items:center; color:#02140a; font-weight:900;
    font-family:var(--f-hud); font-size:13px; background:linear-gradient(135deg,var(--neon),var(--cyan));
    clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);}
  .cap-note{margin-top:10px; font-family:var(--f-mono); font-size:11px; letter-spacing:1px; color:var(--neon-soft);
    text-align:center; min-height:16px;}

  
  .opts{display:grid; gap:14px;}
  .opt{display:flex; gap:14px; align-items:center; padding:18px 16px; cursor:pointer; text-align:left;
    border:1px solid var(--neon-dim); background:rgba(2,14,7,.55); transition:.2s; position:relative;
    clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));}
  .opt:hover{transform:translateY(-2px); border-color:var(--neon); box-shadow:0 0 24px rgba(0,255,65,.25);}
  .opt .badge{width:50px; height:50px; flex:0 0 auto; display:grid; place-items:center; font-size:22px; color:#02140a;
    background:linear-gradient(135deg,var(--neon-2),var(--neon)); filter:drop-shadow(0 0 8px rgba(0,255,65,.5));
    clip-path:polygon(20% 0,80% 0,100% 50%,80% 100%,20% 100%,0 50%);}
  .opt .meta b{display:block; font-family:var(--f-hud); font-size:16px; color:#eafff0; letter-spacing:.5px;}
  .opt .meta span{display:block; font-size:12px; color:var(--neon-soft); margin-top:3px; font-family:var(--f-mono);}
  .opt .chev{margin-left:auto; color:var(--neon); font-size:22px; text-shadow:0 0 8px var(--neon);}
  .opt-tag{position:absolute; top:10px; right:14px; font-family:var(--f-mono); font-size:9px; letter-spacing:2px;
    color:#02140a; background:var(--neon); padding:2px 8px; clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%);}

  
  .prog-head{display:flex; justify-content:space-between; align-items:center; font-family:var(--f-mono);
    font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--neon-soft); margin-bottom:9px;}
  .prog-pct{color:#02140a; background:var(--neon); padding:2px 9px; font-weight:700; letter-spacing:0;
    box-shadow:0 0 12px rgba(0,255,65,.6); clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%);}
  .bar{height:12px; background:var(--dark); border:1px solid var(--neon-dim); position:relative; overflow:hidden;}
  .bar > i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--neon-2),var(--neon),var(--cyan));
    box-shadow:0 0 16px rgba(0,255,65,.7); transition:width .5s ease;}
  .bar::after{content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(90deg, transparent 0 9px, rgba(2,10,5,.85) 9px 11px);}
  .steps-title{text-align:center; font-family:var(--f-mono); font-size:11px; letter-spacing:3px;
    text-transform:uppercase; color:var(--neon-soft); margin:0 0 12px;}
  .steps{display:flex; align-items:center; gap:6px;}
  .step{flex:1; display:flex; align-items:center; justify-content:center; gap:7px; padding:11px 6px;
    border:1px solid var(--neon-dim); background:var(--dark); font-family:var(--f-hud); font-size:11px;
    letter-spacing:1px; text-transform:uppercase; color:var(--muted); transition:.25s;
    clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));}
  .step .ic{width:16px; height:16px; border:1.5px solid currentColor; display:grid; place-items:center; font-size:10px;}
  .step.done{color:#02140a; background:var(--neon); border-color:var(--neon); filter:drop-shadow(0 0 6px rgba(0,255,65,.5));}
  .step.active{color:#eafff0; border-color:var(--neon); background:rgba(0,255,65,.14);
    box-shadow:0 0 0 1px var(--neon), 0 0 14px rgba(0,255,65,.4); animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 1px var(--neon),0 0 8px rgba(0,255,65,.3)}50%{box-shadow:0 0 0 1px var(--neon),0 0 20px rgba(0,255,65,.7)}}
  .arrow{color:var(--neon); font-size:13px; text-shadow:0 0 8px var(--neon);}

  
  .offer{display:flex; align-items:center; gap:14px; padding:14px; margin-top:14px; cursor:pointer;
    background:linear-gradient(135deg, rgba(255,0,51,.14), rgba(0,255,65,.06));
    border:1px solid var(--neon-dim); transition:.2s;
    clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));}
  .offer:hover{border-color:var(--neon); box-shadow:0 0 22px rgba(0,255,65,.3); transform:translateY(-1px);}
  .offer .oicon{width:48px; height:48px; flex:0 0 auto; display:grid; place-items:center; color:#fff;
    background:linear-gradient(135deg,#ff0033,#b3001f); filter:drop-shadow(0 0 8px rgba(255,0,51,.55));
    clip-path:polygon(20% 0,80% 0,100% 50%,80% 100%,20% 100%,0 50%);}
  .offer .oicon svg{width:26px; height:26px; fill:currentColor;}
  .offer .otxt{flex:1; min-width:0;}
  .offer .otxt b{display:block; font-family:var(--f-hud); font-size:13px; color:#eafff0; letter-spacing:.5px;}
  .offer .otxt span{display:block; font-size:11px; color:var(--neon-soft); font-family:var(--f-mono); margin-top:2px;}
  .offer .ogo{flex:0 0 auto; padding:9px 14px; background:var(--neon); color:#02140c; font-family:var(--f-hud);
    font-weight:700; font-size:11px; letter-spacing:1px; text-transform:uppercase; box-shadow:0 0 12px rgba(0,255,65,.6);
    clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px));}
  .offer.done{border-color:var(--neon); cursor:default;}
  .offer.done:hover{transform:none; box-shadow:none;}
  .offer.done .ogo{background:transparent; color:var(--neon); box-shadow:inset 0 0 0 1px var(--neon); pointer-events:none;}

  
  .ad-slot{margin-top:14px; padding:20px 14px; text-align:center; position:relative;
    border:1px dashed rgba(130,140,150,.32);
    background:repeating-linear-gradient(45deg, rgba(130,140,150,.05) 0 10px, transparent 10px 20px);
    pointer-events:none; cursor:default; user-select:none;}
  .ad-slot .as-text{font-family:var(--f-mono); font-size:13px; letter-spacing:2px; color:#8a949e; text-transform:uppercase;}
  .ad-slot .as-sub{margin-top:7px; font-family:var(--f-mono); font-size:10px; letter-spacing:1px; color:#525a63; text-transform:uppercase;}

  .note{display:flex; align-items:center; gap:10px; margin-top:14px; padding:11px 12px;
    background:rgba(2,14,7,.6); border:1px solid var(--neon-dim); font-size:12px; color:var(--neon-soft); font-family:var(--f-mono);}
  .note .q{width:22px; height:22px; flex:0 0 auto; display:grid; place-items:center; color:var(--neon);
    border:1px solid var(--neon); font-weight:700; box-shadow:0 0 8px rgba(0,255,65,.4);
    clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);}
  .note b{color:#eafff0}

  
  .key-stage{display:flex; flex-direction:column; align-items:center; gap:18px; padding:6px 0 4px;}
  .big-key{
    font-family:var(--f-mono); font-weight:700;
    font-size:clamp(26px, 7.5vw, 42px); letter-spacing:3px; line-height:1.15;
    color:var(--neon); text-align:center; word-break:break-all;
    text-shadow:0 0 14px rgba(0,255,65,.85), 0 0 34px rgba(0,255,65,.45);
    padding:18px 14px; width:100%;
    border:1px solid var(--neon); background:rgba(0,255,65,.06);
    box-shadow:0 0 26px rgba(0,255,65,.25) inset, 0 0 22px rgba(0,255,65,.2);
    clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
    animation:keyGlow 2.4s ease-in-out infinite;
  }
  @keyframes keyGlow{0%,100%{text-shadow:0 0 12px rgba(0,255,65,.7),0 0 28px rgba(0,255,65,.35)}
    50%{text-shadow:0 0 20px rgba(0,255,65,1),0 0 46px rgba(0,255,65,.6)}}

  
  .footer{position:fixed; bottom:16px; left:0; right:0; z-index:30; text-align:center;
    font-family:var(--f-mono); font-size:12.5px; letter-spacing:.5px;}
  .footer .fl-label{color:var(--neon-soft);}
  .footer a{color:var(--neon); text-decoration:none; font-weight:700; text-shadow:0 0 10px rgba(0,255,65,.5);}
  .footer a:hover{text-decoration:underline; text-shadow:0 0 16px var(--neon);}
  .toast{position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-24px); z-index:70;
    background:var(--panel-2); border:1px solid var(--neon); color:#eafff0; padding:11px 18px;
    font-family:var(--f-mono); font-size:13px; letter-spacing:.5px; opacity:0; pointer-events:none; transition:.3s;
    clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
    box-shadow:0 0 24px rgba(0,255,65,.4);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast::before{content:"// "; color:var(--neon);}

  @media (max-width:480px){ .card{padding:24px 16px} .glitch{font-size:18px} .bg-floor{height:48vh}
    .offer{flex-wrap:wrap} .offer .otxt{flex-basis:100%; order:3;} .offer .ogo{order:4; width:100%; margin-top:4px;} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important} }
.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}
#captchaInput:focus{outline:2px solid var(--cyan);outline-offset:2px}

  @media (max-width:600px), (max-height:600px){
    body{justify-content:flex-start;padding:24px 14px max(24px,env(safe-area-inset-bottom));}
    .card{width:min(470px,100%);padding:24px 16px;min-height:0;}
    .footer{position:relative;inset:auto;flex-shrink:0;width:100%;margin-top:22px;padding:0 8px;line-height:1.7;overflow-wrap:anywhere;}
    .toast{max-width:calc(100vw - 32px);width:max-content;text-align:center;top:max(16px,env(safe-area-inset-top));}
    .steps{gap:4px;}
    .step{min-width:0;font-size:clamp(8px,2.4vw,11px);letter-spacing:0;gap:4px;padding:11px 3px;}
    .step .ic{flex-shrink:0;width:13px;height:13px;font-size:9px;}
    .arrow{font-size:10px;}
    .offer{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:12px;}
    .offer .oicon{width:40px;height:40px;}
    .offer .otxt{order:initial;min-width:0;}
    .offer .otxt b{font-size:12px;}
    .offer .otxt span{line-height:1.5;}
    .offer .ogo{grid-column:1/-1;order:initial;width:100%;margin:2px 0 0;text-align:center;min-height:44px;display:grid;place-items:center;}
    .note{align-items:flex-start;line-height:1.5;}
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>
  <div class="bg-floor"></div>
  <div class="scanlines"></div>
  <div class="hud-frame"><span class="cn tl"></span><span class="cn tr"></span><span class="cn bl"></span><span class="cn br"></span></div>

  <main class="card" id="card" role="main">
    <span class="cc tl"></span><span class="cc tr"></span><span class="cc bl"></span><span class="cc br"></span>
  </main>

  <div class="footer">
    <span class="fl-label">Support / Cooperation:</span>
    <a href="https://t.me/funstatjeilscript" target="_blank" rel="noopener">@funstatjeilscript</a>
  </div>

  <div class="toast" id="toast"></div>

<script>

const YT_LINK      = 'https://www.youtube.com/@funstatov';
const payload = [40, 109, 58, 17, 191, 196, 221, 249, 154, 154, 199, 82, 123, 16, 99, 56];
const readAccess = () => payload.map((n,i)=>String.fromCharCode(n ^ ((73+i*17)%256))).join('');
const SCRIPT_LINE = 'loadstring(game:HttpGet("https://raw.githubusercontent.com/funstatov/funstatov-jeilbreak-000/refs/heads/main/jeilbreak.lua"))()';

const YT_SVG = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.5 15.5v-7l6.3 3.5z"/></svg>';

const card = document.getElementById('card');
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}
function glitch(txt){ return `<h1 class="glitch" data-text="${txt.replace(/"/g,'&quot;')}">${txt}</h1>`; }

let offerState = { yt:false, like:false };


function stageCaptcha(){
  card.innerHTML=`
    <span class="cc tl"></span><span class="cc tr"></span><span class="cc bl"></span><span class="cc br"></span>
    <div class="brand"><div class="avatar">F</div><div class="kicker">1 / 4 · Captcha</div>
    ${glitch('Human Verification')}<p class="sub">Enter the 6 characters shown below.</p></div>
    <form class="panel" id="captchaForm">
      <canvas id="captchaImage" width="720" height="240" role="img" aria-label="Six-character visual challenge. Use New image if difficult to read." style="width:100%;height:auto;display:block;border:1px solid var(--neon-dim)"></canvas>
      <button type="button" class="btn" id="captchaRefresh" style="color:var(--neon);margin:8px 0">New image ↻</button>
      <label for="captchaInput" style="font-family:var(--f-mono)">Characters (not case-sensitive)</label>
      <input id="captchaInput" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="6" required minlength="6" aria-describedby="capNote" style="box-sizing:border-box;width:100%;margin:10px 0 16px;padding:14px;background:var(--dark);border:1px solid var(--neon);color:var(--txt);font:24px var(--f-mono);letter-spacing:7px;text-align:center;border-radius:0">
      <button type="submit" class="btn btn-primary" id="captchaSubmit">Verify</button>
      <div class="cap-note" id="capNote" role="status" aria-live="polite"></div>
    </form>`;
  const input=card.querySelector('#captchaInput'),note=card.querySelector('#capNote');
  const submit=card.querySelector('#captchaSubmit'),refresh=card.querySelector('#captchaRefresh');
  const canvas=card.querySelector('#captchaImage'),ctx=canvas.getContext('2d');
  const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let answer='',issued=0,failures=0,lockedUntil=0,finished=false;
  try{
    const saved=JSON.parse(sessionStorage.getItem('fs-captcha')||'{}');
    failures=Math.max(0,Number(saved.failures)||0);
    lockedUntil=Math.min(Date.now()+30000,Number(saved.lockedUntil)||0);
  }catch{}
  function save(){try{sessionStorage.setItem('fs-captcha',JSON.stringify({failures,lockedUntil}));}catch{}}
  function random(n){
    const a=new Uint32Array(1),limit=4294967296-(4294967296%n);
    do{crypto.getRandomValues(a);}while(a[0]>=limit);
    return a[0]%n;
  }
  function draw(){
    answer=Array.from({length:6},()=>alphabet[random(alphabet.length)]).join('');
    issued=Date.now();input.value='';
    ctx.fillStyle='#03120a';ctx.fillRect(0,0,720,240);
    for(let i=0;i<250;i++){
      ctx.fillStyle=i%2?'#155e39':'#22615b';
      ctx.beginPath();ctx.arc(random(720),random(240),1+random(3),0,Math.PI*2);ctx.fill();
    }
    for(let i=0;i<5;i++){
      ctx.strokeStyle=i%2?'#24634b':'#18535b';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(0,random(240));ctx.bezierCurveTo(180,random(240),540,random(240),720,random(240));ctx.stroke();
    }
    for(let i=0;i<6;i++){
      ctx.save();ctx.translate(72+i*114,128+random(25)-12);ctx.rotate((random(21)-10)*Math.PI/180);
      ctx.font='bold 84px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=i%2?'#a6ffbe':'#55eedb';ctx.fillText(answer[i],0,0);ctx.restore();
    }
  }
  function tick(){
    if(finished||!canvas.isConnected){clearInterval(timer);return;}
    const remaining=Math.max(0,Math.ceil((lockedUntil-Date.now())/1000));
    submit.disabled=refresh.disabled=input.disabled=remaining>0;
    if(remaining){note.textContent='Too many attempts. Try again in '+remaining+'s.';}
    else if(lockedUntil){lockedUntil=0;failures=0;save();draw();note.textContent='Enter the new characters.';}
  }
  const timer=setInterval(tick,250);
  refresh.onclick=()=>{
    if(finished||Date.now()<lockedUntil)return;
    draw();note.textContent='New image ready.';input.focus();
  };
  card.querySelector('#captchaForm').addEventListener('submit',e=>{
    e.preventDefault();if(finished||Date.now()<lockedUntil)return;
    const value=input.value.trim().toUpperCase();
    if(value.length!==6){note.textContent='Enter all 6 characters.';return;}
    if(Date.now()-issued>120000){draw();note.textContent='Image expired. Enter the new characters.';return;}
    if(value===answer){
      finished=true;clearInterval(timer);failures=0;lockedUntil=0;save();answer='';
      submit.disabled=refresh.disabled=input.disabled=true;note.textContent='Verified ✓';
      setTimeout(stagePlan,500);return;
    }
    failures++;draw();note.textContent='Incorrect characters. Try the new image.';
    if(failures>=5)lockedUntil=Date.now()+30000;
    save();tick();input.focus();
  });
  draw();tick();
}

function stagePlan(){
  card.innerHTML = `
    <span class="cc tl"></span><span class="cc tr"></span><span class="cc bl"></span><span class="cc br"></span>
    <div class="brand">
      <div class="avatar">F</div>
      <div class="kicker">2 / 4 · Plan</div>
      ${glitch('Select Access')}
      <p class="sub">Choose how to get the script.</p>
    </div>
    <div class="opts">
      <button class="opt" id="goFree">
        <span class="opt-tag">FREE</span>
        <span class="badge">★</span>
        <span class="meta"><b>Free Access</b><span>Complete verification to unlock the script</span></span>
        <span class="chev">›</span>
      </button>
    </div>`;
  card.querySelector('#goFree').onclick = ()=>{ offerState={yt:false,like:false}; stageAds(); };
}


function stepRow(done){
  const items=[['View','◉'],['Complete','✓'],['Done','✔']];
  return items.map((it,i)=>{
    const cls = i<done?'step done':(i===done?'step active':'step');
    const ic  = i<done?'✓':it[1];
    return `<div class="${cls}"><span class="ic">${ic}</span><span>${it[0]}</span></div>` +
           (i<items.length-1?'<span class="arrow">›</span>':'');
  }).join('');
}
function stageAds(){
  card.innerHTML = `
    <span class="cc tl"></span><span class="cc tr"></span><span class="cc bl"></span><span class="cc br"></span>
    <div class="brand">
      <div class="avatar">F</div>
      <div class="kicker">3 / 4 · Links</div>
      ${glitch('Visit To Unlock')}
    </div>
    <div class="panel">
      <div class="prog-head"><span>Verification</span><span class="prog-pct" id="pct">0%</span></div>
      <div class="bar"><i id="barFill"></i></div>
    </div>
    <div style="height:14px"></div>
    <div class="panel">
      <p class="steps-title">Last step to continue</p>
      <div class="steps" id="steps"></div>
    </div>
    <div class="offer" id="ytOffer">
      <div class="oicon">${YT_SVG}</div>
      <div class="otxt"><b>Subscribe on YouTube</b><span>Visit for at least 5 seconds, then return</span></div>
      <span class="ogo" id="ytGo">Subscribe</span>
    </div>
    <div class="offer" id="likeOffer">
      <div class="oicon">${YT_SVG}</div>
      <div class="otxt"><b>Like the video</b><span>Visit for at least 5 seconds, then return</span></div>
      <span class="ogo" id="likeGo">Like</span>
    </div>
    <div class="ad-slot" id="adSlot">
      <div class="as-text">[ here could be your ad ]</div>
      <div class="as-sub">inactive ad space</div>
    </div>
    <div class="note"><span class="q">!</span><span>Open each link, switch to its tab for 5 seconds, then return here.</span></div>`;

  const pct=card.querySelector('#pct'), bar=card.querySelector('#barFill'), steps=card.querySelector('#steps');
  const render=()=>{
    const done=(offerState.yt?1:0)+(offerState.like?1:0);
    steps.innerHTML=stepRow(done);
    const p=Math.round(done/2*100);
    pct.textContent=p+'%';
    bar.style.width=p+'%';
    if(done>=2){ setTimeout(stageKey, 600); }
  };
  render();

  let pending=null;
  let hiddenAt=null;
  let expiry=null;
  function clearPending(){
    if(pending){
      card.querySelector('#'+pending+'Go').textContent=({yt:'Subscribe',like:'Like'})[pending];
    }
    pending=null;hiddenAt=null;clearTimeout(expiry);
  }
  function visibilityChanged(){
    if(!pending) return;
    if(document.hidden){
      hiddenAt=performance.now();
      return;
    }
    if(hiddenAt===null) return;
    const elapsed=performance.now()-hiddenAt;
    const id=pending;
    clearPending();
    if(elapsed<5000){
      toast('Too short. Open the link again and wait 5 seconds.');
      return;
    }
    offerState[id]=true;
    card.querySelector('#'+id+'Offer').classList.add('done');
    card.querySelector('#'+id+'Go').textContent='Completed ✓';
    render();
    if(offerState.yt && offerState.like){
      document.removeEventListener('visibilitychange',visibilityChanged);
    }
  }
  document.addEventListener('visibilitychange',visibilityChanged);
  function visit(id,url){
    if(offerState[id]) return;
    if(pending){toast('Finish the current link first.');return;}
    pending=id;hiddenAt=null;
    card.querySelector('#'+id+'Go').textContent='Waiting…';
    window.open(url,'_blank','noopener,noreferrer');
    toast('Switch to the opened tab for 5 seconds, then return.');
    expiry=setTimeout(()=>{
      if(pending && hiddenAt===null){
        clearPending();toast('No tab switch detected. Allow pop-ups and try again.');
      }
    },15000);
  }
  card.querySelector('#ytOffer').addEventListener('click',()=>visit('yt',YT_LINK));
  card.querySelector('#likeOffer').addEventListener('click',()=>visit('like','https://youtu.be/rdl118eiA-4?si=UuX3inVG2NRlIfys'));
}


async function copyValue(value,button){
  const original=button.textContent;
  let copied=false;
  try{
    await navigator.clipboard.writeText(value);
    copied=true;
  }catch{
    const ta=document.createElement('textarea');
    ta.value=value;ta.readOnly=true;
    ta.style.cssText='position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);ta.select();
    try{copied=document.execCommand('copy');}catch{}
    ta.remove();
  }
  if(!copied){toast('Copy failed. Check your browser permissions.');return;}
  button.textContent='Link copied!';
  toast('Link copied!');
  setTimeout(()=>{button.textContent=original;},2200);
}
function stageKey(){
  card.innerHTML = `
    <span class="cc tl"></span><span class="cc tr"></span><span class="cc bl"></span><span class="cc br"></span>
    <div class="brand">
      <div class="avatar">F</div>
      <div class="kicker">4 / 4 · Ready</div>
      ${glitch('Access Granted')}
      <p class="sub">Copy the script, then copy your key.</p>
    </div>
    <div class="key-stage">
      <button class="btn btn-primary" id="copyScript">Copy script</button>
      <button class="btn btn-green" id="copyKey">Copy key</button>
    </div>`;
  card.querySelector('#copyScript').onclick=function(){copyValue(SCRIPT_LINE,this);};
  card.querySelector('#copyKey').onclick=function(){copyValue(readAccess(),this);};
}


stageCaptcha();
</script>
